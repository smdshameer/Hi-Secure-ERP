<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiSecure ERP v2.0</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <style>
      /* Set bg BEFORE JS/CSS loads so there's never a white flash */
      html, body, #root {
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      /* Smooth fade-in when new page content mounts */
      @keyframes pageFadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
      main > * {
        animation: pageFadeIn 0.18s ease-out both;
      }
    </style>
  </head>
  <body style="background-color:#f8fafc">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
