worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream hisecure_api {
        server api-server:3004;
    }

    server {
        listen 80;
        server_name localhost;

        # Redirect all HTTP traffic to HTTPS (stubbed for production mapping)
        # listen 443 ssl;
        # ssl_certificate /etc/nginx/certs/hisecure.crt;
        # ssl_certificate_key /etc/nginx/certs/hisecure.key;

        client_max_body_size 50M;

        location / {
            proxy_pass http://hisecure_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle attachment downloads securely
        location /api/v1/tech/attachments {
            proxy_pass http://hisecure_api;
            proxy_read_timeout 300s;
        }
    }
}
