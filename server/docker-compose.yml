version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hisecure-postgres
    restart: always
    environment:
      POSTGRES_DB: hisecure_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hisecure_secure_db_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hisecure-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hisecure-api-server
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:hisecure_secure_db_pass_2026@postgres:5432/hisecure_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: hisecure-prod-secret-key-change-this-in-env
      PORT: 3004
      NODE_ENV: production
    ports:
      - "3004:3004"
    depends_on:
      - postgres
      - redis
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs

  nginx:
    image: nginx:alpine
    container_name: hisecure-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-server

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
